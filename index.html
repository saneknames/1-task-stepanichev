<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление студентами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <fieldset class="card">
            <label id="formTitle">Добавление студента</label>
            <div class="line">
                <div class="field">
                    <label>Фамилия</label>
                    <input type="text"
                           id="lastName"
                           placeholder="Введите фамилию...">
                </div>
                <div class="field">
                    <label>Имя</label>
                    <input type="text"
                           id="firstName"
                           placeholder="Введите имя...">
                </div>
                <div class="field">
                    <label>Отчество</label>
                    <input type="text"
                           id="middleName"
                           placeholder="Введите отчество...">
                </div>
            </div>
            <div class="line">
                <div class="field">
                    <label>Тип набора</label>
                    <select id="enrollmentType">
                        <option value="" disabled selected hidden>Введите тип набора</option>
                        <option value="1">Бюджетный</option>
                        <option value="2">Коммерция</option>
                        <option value="3">Целевой</option>
                    </select>
                </div>
                <div class="field half">
                    <label>Средний балл</label>
                    <input type="number"
                           step="0.1"
                           id="avgScore"
                           min="2" max="5"
                           placeholder="Введите средний балл...">
                </div>
                <div class="field half">
                    <label>Номер телефона</label>
                    <input type="text"
                           id="phone"
                           placeholder="Введите номер телефона...">
                </div>
                <div class="field">
                    <label>Дата рождения</label>
                    <input type="date"
                           id="birthDate">
                </div>
            </div>
            <div class="line-button">
                <button id="saveButton"
                        class="button-primary">
                        Добавить
                </button>
                <button id="cancelButton"
                        class="button-cancel">
                        Отменить
                </button>
            </div>
        </fieldset>

        <fieldset class="card">
            <label>Список студентов</label>
            <div class="filters">
                <div class="field">
                    <label>Фильтр по типу набора</label>
                    <select id="filter">
                        <option value="">Все</option>
                        <option value="1">Бюджетный</option>
                        <option value="2">Коммерция</option>
                        <option value="3">Целевой</option>
                    </select>
                </div>
                <div class="field">
                    <label>Поиск по ФИО</label>
                    <input type="text"
                           id="searchFullName"
                           placeholder="Введите ФИО...">
                </div>
                <div class="field">
                    <label>Сортировка по ср.баллу</label>
                    <select id="sortScore">
                        <option value="1">По возрастанию</option>
                        <option value="2">По убыванию</option>
                    </select>
                </div>
                <div class="field">
                    <label>Сортировка по дате рождения</label>
                    <select id="sortBirth">
                        <option value="1">По возрастанию</option>
                        <option value="2">По убыванию</option>
                    </select>
                </div>
                <label class="check">
                    <input type="checkbox"
                           id="showActive"
                           checked>
                    Активные
                </label>
                <label class="check">
                    <input type="checkbox"
                           id="showInactive"
                           checked>
                    Неактивные
                </label>
            </div>

            <div id="studentsList" class="students-list"></div>
        </fieldset>
    </div>

    <div id="deleteWindow" 
         class="delete-window">
        <div class="delete-box">
            <button id="deleteClose" 
                    class="delete-close">
                    ✕
            </button>
            <h3 class="delete-title">
                Удаление карточки студента
            </h3>
            <p class="delete-text">
                Вы действительно хотите удалить карточку студента <br> <b id="deleteName"></b>?
            </p>
            <div class="delete-buttons">
                <button id="deleteNo" 
                        class="delete-button no">
                        Отменить
                </button>
                <button id="deleteYes" 
                        class="delete-button yes">
                        Удалить
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
